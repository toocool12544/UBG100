<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="./coi-serviceworker.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AuroraOS | Unblocked Games & Apps</title>
    <meta name="description" content="Ultra-fast unblocked games portal, retro emulators, media player, and productivity suite with blue aurora aesthetic." />
    <meta property="og:title" content="AuroraOS | Unblocked Games & Apps" />
    <meta property="og:description" content="Ultra-fast unblocked games portal, retro emulators, media player, and productivity suite with blue aurora aesthetic." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><circle cx='12' cy='12' r='10'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite development entry point -->
    <script type="module" src="./src/main.tsx"></script>
    <!-- Static entry point fallback for direct GitHub Pages hosting -->
    <script type="module">
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = './assets/main.css';
            document.head.appendChild(css);

            const script = document.createElement('script');
            script.type = 'module';
            script.src = './assets/main.js';
            document.body.appendChild(script);
          }
        }, 120);
      });
    </script>
  </body>
</html>
